[project]
name = "evedw"
version = "0.1.0"
description = "Local EVE Online data warehouse: killmails, entities and market history"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "duckdb>=1.4",
    "pyarrow>=20",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "typer>=0.15",
]

[project.scripts]
evedw = "evedw.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evedw"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pyarrow-stubs>=17",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "DTZ", "PTH", "T20"]
ignore = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["evedw", "tests"]

[tool.ruff.lint.per-file-ignores]
"docs/prototypes/*" = ["T20"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
reportMissingTypeStubs = false
# pyarrow-stubs leaves many signatures partially typed; these two rules only report that noise.
reportUnknownMemberType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real network services; never run by default",
    "duckdb_only: needs the DuckDB backend; not run against the in-memory store stub",
]
addopts = "-m 'not live'"
asyncio_mode = "auto"
